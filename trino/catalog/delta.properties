# Silver / Gold layer: Delta Lake tables written by Spark (simulates Athena + Glue Catalog).
connector.name=delta_lake
# File-based metastore stored in MinIO itself: no Hive Metastore container needed (lab only).
hive.metastore=file
hive.metastore.catalog.dir=s3://datalake/_trino_metastore/delta
delta.register-table-procedure.enabled=true
delta.enable-non-concurrent-writes=true

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
